name: Apply asset and check animation fix

on:
  push:
    branches:
      - fix-assets-check-animation

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-assets-check-animation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # 1) Keep SPA route rewrites from swallowing real static assets.
          p = Path('vercel.json')
          data = json.loads(p.read_text())
          data['rewrites'] = [
              {'source': '/home', 'destination': '/index.html'},
              {'source': '/play', 'destination': '/index.html'},
              {'source': '/online', 'destination': '/index.html'},
              {'source': '/leaderboard', 'destination': '/index.html'},
              {'source': '/settings', 'destination': '/index.html'},
              {'source': '/history', 'destination': '/index.html'},
              {'source': '/tactics', 'destination': '/index.html'},
          ]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # 2) Make the shared check splash event-based so AI replies cannot cancel it immediately.
          p = Path('src/components/ChessBoard.tsx')
          s = p.read_text()
          s = s.replace(
              'import { useState, useEffect } from "react";',
              'import { useState, useEffect, useRef } from "react";',
          )
          s = s.replace(
              '  showCheckmateBanner,\n  className,',
              '  showCheckmateBanner,\n  splashTrigger,\n  className,',
          )
          s = s.replace(
              '  showCheckmateBanner?: boolean;\n  className?: string;',
              '  showCheckmateBanner?: boolean;\n  splashTrigger?: number;\n  className?: string;',
          )
          old = '''  // Check/Checkmate/King Capture 3-second non-blocking calligraphy splash state\n  const [showMateSplash, setShowMateSplash] = useState(false);\n  const [splashKey, setSplashKey] = useState(0);\n\n  useEffect(() => {\n    if (showCheckmateBanner || showCheckBanner) {\n      setSplashKey((k) => k + 1);\n      setShowMateSplash(true);\n      const timer = setTimeout(() => {\n        setShowMateSplash(false);\n      }, 3000);\n      return () => clearTimeout(timer);\n    } else {\n      setShowMateSplash(false);\n    }\n  }, [showCheckmateBanner, showCheckBanner, lastMove?.from, lastMove?.to]);\n'''
          new = '''  // Check/Checkmate/King Capture 3-second non-blocking calligraphy splash state.\n  // Trigger on the check event itself and let the splash finish even if AI answers immediately.\n  const [showMateSplash, setShowMateSplash] = useState(false);\n  const [splashKey, setSplashKey] = useState(0);\n  const previousCheckRef = useRef(false);\n  const previousCheckmateRef = useRef(false);\n  const previousSplashTriggerRef = useRef(splashTrigger ?? 0);\n  const splashTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n\n  useEffect(() => {\n    const nextTrigger = splashTrigger ?? 0;\n    const checkStarted = Boolean(showCheckBanner) && !previousCheckRef.current;\n    const checkmateStarted = Boolean(showCheckmateBanner) && !previousCheckmateRef.current;\n    const explicitTrigger = nextTrigger !== previousSplashTriggerRef.current;\n\n    previousCheckRef.current = Boolean(showCheckBanner);\n    previousCheckmateRef.current = Boolean(showCheckmateBanner);\n    previousSplashTriggerRef.current = nextTrigger;\n\n    if (!checkStarted && !checkmateStarted && !explicitTrigger) return;\n\n    if (splashTimerRef.current) clearTimeout(splashTimerRef.current);\n    setSplashKey((k) => k + 1);\n    setShowMateSplash(true);\n    splashTimerRef.current = setTimeout(() => {\n      setShowMateSplash(false);\n      splashTimerRef.current = null;\n    }, 3000);\n  }, [showCheckmateBanner, showCheckBanner, splashTrigger]);\n\n  useEffect(() => {\n    return () => {\n      if (splashTimerRef.current) clearTimeout(splashTimerRef.current);\n    };\n  }, []);\n'''
          if old not in s:
              raise SystemExit('ChessBoard splash block not found')
          s = s.replace(old, new)
          p.write_text(s)

          # 3) Emit an explicit splash trigger from the offline commit path (AI + local).
          p = Path('src/routes/play.tsx')
          s = p.read_text()
          s = s.replace(
              '  const [hint, setHint] = useState<number[]>([]);',
              '  const [hint, setHint] = useState<number[]>([]);\n  const [checkSplashTrigger, setCheckSplashTrigger] = useState(0);',
          )
          s = s.replace(
              '      } else if (nextStatus === "check") {\n        audioManager.playSfx("check");',
              '      } else if (nextStatus === "check") {\n        setCheckSplashTrigger((value) => value + 1);\n        audioManager.playSfx("check");',
          )
          s = s.replace(
              '      setHint([]);\n    },\n    [selectedRulesetId, selectedTimeControl],',
              '      setHint([]);\n      setCheckSplashTrigger(0);\n    },\n    [selectedRulesetId, selectedTimeControl],',
          )
          s = s.replace(
              '            showCheckmateBanner={\n              matchStatus === "checkmate" ||',
              '            splashTrigger={checkSplashTrigger}\n            showCheckmateBanner={\n              matchStatus === "checkmate" ||',
          )
          p.write_text(s)
          PY

          npx prettier --write vercel.json src/components/ChessBoard.tsx src/routes/play.tsx
      - name: Install dependencies
        run: npm ci
      - name: Core engine tests
        run: npm test
      - name: Auth security regression tests
        run: npm run test:auth
      - name: Asset integrity
        run: npm run check:assets
      - name: Production build
        run: npm run build
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-assets-check-animation.yml
          git add vercel.json src/components/ChessBoard.tsx src/routes/play.tsx .github/workflows/fix-assets-check-animation.yml
          git commit -m "fix: restore assets and sync check splash for AI"
          git push origin HEAD:fix-assets-check-animation
