name: Apply home/play UX and feedback form

on:
  push:
    branches:
      - fix/home-play-ux-feedback

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-play-ux-feedback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused UX changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/home.tsx')
          s = p.read_text()
          s = s.replace(
              'import { createFileRoute, Link } from "@tanstack/react-router";\nimport { Bot, ChevronRight, Crown, Globe2, Swords, Users } from "lucide-react";',
              'import { createFileRoute, Link } from "@tanstack/react-router";\nimport { useState } from "react";\nimport { Bot, ChevronRight, Crown, Globe2, Sparkles, Swords, Users, X } from "lucide-react";',
          )
          marker = 'const HOME_OUK_PIECES: PieceType[] = ["k", "q", "b", "n", "r", "p"];\n'
          replacement = '''const HOME_OUK_PIECES: PieceType[] = ["k", "q", "b", "n", "r", "p"];\n\nconst AI_OPPONENTS = [\n  { depth: 1, key: "novice", piece: "p" as PieceType, title: "Trey Scout", note: "Calm, forgiving, good for learning." },\n  { depth: 2, key: "apprentice", piece: "n" as PieceType, title: "Ses Rider", note: "Faster tactics and sharper replies." },\n  { depth: 3, key: "master", piece: "b" as PieceType, title: "Koul Strategist", note: "Plans ahead and punishes loose moves." },\n  { depth: 4, key: "grandmaster", piece: "k" as PieceType, title: "Angkor Grandmaster", note: "The strongest challenge on this board." },\n] as const;\n'''
          if marker not in s: raise SystemExit('home marker not found')
          s = s.replace(marker, replacement, 1)
          s = s.replace(
              '  const { t, lang } = useI18n();\n  const dailyQuote = getDailyQuote(lang);',
              '  const { t, lang } = useI18n();\n  const dailyQuote = getDailyQuote(lang);\n  const [showAiGate, setShowAiGate] = useState(false);',
              1,
          )
          old = '''        <Link\n          to="/play"\n          search={{ mode: "ai" }}\n          className="group relative flex flex-col justify-between overflow-hidden rounded-3xl border border-border bg-card p-4 transition-all duration-300 hover:-translate-y-1 hover:border-gold/60 hover:shadow-temple active:scale-[0.98]"\n        >\n          <div className="flex items-start justify-between">\n            <span className="grid h-11 w-11 place-items-center rounded-2xl border border-gold/40 bg-secondary text-gold-dark transition-transform duration-300 group-hover:scale-105">\n              <Bot className="h-5 w-5" />\n            </span>\n            <ChevronRight className="h-4 w-4 text-muted-foreground transition-transform duration-300 group-hover:translate-x-0.5 group-hover:text-gold" />\n          </div>\n          <div className="mt-4">\n            <h4 className="font-serif text-sm font-semibold text-foreground">{t("play_vs_ai")}</h4>\n            <p className="mt-0.5 text-[11px] text-muted-foreground">{t("play_vs_ai_desc")}</p>\n          </div>\n        </Link>'''
          new = '''        <button\n          type="button"\n          onClick={() => setShowAiGate(true)}\n          className="group relative flex flex-col justify-between overflow-hidden rounded-3xl border border-border bg-card p-4 text-left transition-all duration-300 hover:-translate-y-1 hover:border-gold/60 hover:shadow-temple active:scale-[0.98]"\n        >\n          <div className="flex items-start justify-between">\n            <span className="grid h-11 w-11 place-items-center rounded-2xl border border-gold/40 bg-secondary text-gold-dark transition-transform duration-300 group-hover:scale-105">\n              <Bot className="h-5 w-5" />\n            </span>\n            <span className="flex items-center gap-1 rounded-full border border-gold/30 bg-gold/10 px-2 py-1 text-[9px] font-bold uppercase tracking-wider text-gold-dark">\n              <Sparkles className="h-3 w-3" /> 4 rivals\n            </span>\n          </div>\n          <div className="mt-4">\n            <h4 className="font-serif text-sm font-semibold text-foreground">{t("play_vs_ai")}</h4>\n            <p className="mt-0.5 text-[11px] text-muted-foreground">Choose your rival before entering the board.</p>\n          </div>\n        </button>'''
          if old not in s: raise SystemExit('home AI card not found')
          s = s.replace(old, new, 1)
          gate = '''      {showAiGate && (\n        <div className="fixed inset-0 z-50 flex items-end justify-center bg-background/75 p-3 backdrop-blur-sm sm:items-center" onClick={() => setShowAiGate(false)}>\n          <section role="dialog" aria-modal="true" aria-label="Choose AI opponent" onClick={(event) => event.stopPropagation()} className="kbach-frame w-full max-w-md rounded-[2rem] border border-gold/50 bg-card p-4 shadow-2xl animate-rise sm:p-5">\n            <div className="mb-4 flex items-start justify-between gap-3">\n              <div>\n                <p className="text-[10px] font-bold uppercase tracking-[0.2em] text-gold-dark">Temple challengers</p>\n                <h3 className="mt-1 font-serif text-xl font-bold text-foreground">Choose your AI rival</h3>\n                <p className="mt-1 text-xs text-muted-foreground">One tap starts the match. Rules use your saved default.</p>\n              </div>\n              <button type="button" onClick={() => setShowAiGate(false)} className="grid h-9 w-9 shrink-0 place-items-center rounded-full border border-border bg-secondary text-muted-foreground transition hover:border-gold/60 hover:text-foreground"><X className="h-4 w-4" /></button>\n            </div>\n            <div className="grid grid-cols-2 gap-2.5">\n              {AI_OPPONENTS.map((opponent) => (\n                <Link key={opponent.depth} to="/play" search={{ mode: "ai", depth: opponent.depth }} className="group rounded-2xl border border-border bg-secondary/40 p-3 transition-all hover:-translate-y-0.5 hover:border-gold/70 hover:bg-gold/10 active:scale-[0.98]">\n                  <div className="flex items-center justify-between gap-2">\n                    <span className="grid h-11 w-11 place-items-center rounded-xl border border-gold/30 bg-card"><OukPiece type={opponent.piece} color="b" className="h-9 w-9" /></span>\n                    <ChevronRight className="h-4 w-4 text-muted-foreground transition group-hover:translate-x-0.5 group-hover:text-gold-dark" />\n                  </div>\n                  <p className="mt-2 font-serif text-xs font-bold text-foreground">{opponent.title}</p>\n                  <p className="text-[10px] font-semibold text-gold-dark">{t(opponent.key)}</p>\n                  <p className="mt-1 text-[10px] leading-relaxed text-muted-foreground">{opponent.note}</p>\n                </Link>\n              ))}\n            </div>\n          </section>\n        </div>\n      )}\n\n'''
          marker2 = '      {/* Daily Wisdom Section */}'
          if marker2 not in s: raise SystemExit('home insert marker not found')
          s = s.replace(marker2, gate + marker2, 1)
          p.write_text(s)

          p = Path('src/routes/play.tsx')
          s = p.read_text()
          old = '''  validateSearch: (search: Record<string, unknown>): { mode?: "ai" | "local" } => {\n    return {\n      mode: (search.mode as "ai" | "local") || undefined,\n    };\n  },'''
          new = '''  validateSearch: (search: Record<string, unknown>): { mode?: "ai" | "local"; depth?: number } => {\n    const rawDepth = Number(search.depth);\n    const depth = Number.isInteger(rawDepth) && rawDepth >= 1 && rawDepth <= 4 ? rawDepth : undefined;\n    return { mode: (search.mode as "ai" | "local") || undefined, depth };\n  },'''
          if old not in s: raise SystemExit('play search validation not found')
          s = s.replace(old, new, 1)
          s = s.replace('  const [depth, setDepth] = useState(2);', '  const [depth, setDepth] = useState(search?.depth ?? 2);', 1)
          old = '''  useEffect(() => {\n    if (search?.mode) {\n      setMode(search.mode);\n    }\n  }, [search?.mode]);'''
          new = '''  useEffect(() => {\n    if (search?.mode) setMode(search.mode);\n    if (search?.depth) setDepth(search.depth);\n  }, [search?.mode, search?.depth]);'''
          if old not in s: raise SystemExit('play search effect not found')
          s = s.replace(old, new, 1)
          s = s.replace('  const [showNewGameModal, setShowNewGameModal] = useState(search?.mode === "ai");', '  const [showNewGameModal, setShowNewGameModal] = useState(false);', 1)
          old = '''            <button\n              type="button"\n              onClick={() => {\n                const nextMode: Mode = mode === "ai" ? "local" : "ai";\n                setMode(nextMode);\n                reset(matchRulesetId, matchTimeControl);\n              }}\n              className="flex items-center gap-1 rounded-lg border border-border/80 bg-secondary/70 px-2 py-0.5 text-[11px] font-semibold text-foreground hover:border-gold/50 active:scale-95 transition-all"\n            >\n              {mode === "ai" ? (\n                <>\n                  <Bot className="h-3.5 w-3.5 text-gold-dark" />\n                  <span>AI ({t(LEVELS[depth - 1]?.key ?? "novice")})</span>\n                </>\n              ) : (\n                <>\n                  <Users className="h-3.5 w-3.5 text-gold-dark" />\n                  <span>{t("local_2p")}</span>\n                </>\n              )}\n            </button>'''
          new = '''            <div className="flex items-center gap-1 rounded-lg border border-border/80 bg-secondary/70 px-2 py-0.5 text-[11px] font-semibold text-foreground">\n              {mode === "ai" ? (<> <Bot className="h-3.5 w-3.5 text-gold-dark" /> <span>AI • {t(LEVELS[depth - 1]?.key ?? "novice")}</span> </>) : (<> <Users className="h-3.5 w-3.5 text-gold-dark" /> <span>{t("local_2p")}</span> </>)}\n              <span className="text-muted-foreground">•</span>\n              <span>{matchTimeControl === "blitz" ? t("blitz_time") : t("standard_time")}</span>\n            </div>'''
          if old not in s: raise SystemExit('play mode switch not found')
          s = s.replace(old, new, 1)
          a = s.find('            {/* Mode Selection */}')
          b = s.find('            {/* AI Difficulty (if mode === \'ai\') */}', a)
          if a < 0 or b < 0: raise SystemExit('play modal mode block not found')
          s = s[:a] + s[b:]
          p.write_text(s)

          p = Path('src/routes/settings.tsx')
          s = p.read_text()
          s = s.replace('  Languages,\n  Moon,', '  Languages,\n  Mail,\n  MessageSquare,\n  Moon,', 1)
          s = s.replace('  Sparkles,\n  User,', '  Send,\n  Sparkles,\n  User,', 1)
          anchor = '  const [authModalOpen, setAuthModalOpen] = useState(false);'
          states = '''  const [authModalOpen, setAuthModalOpen] = useState(false);\n  const [feedbackOpen, setFeedbackOpen] = useState(false);\n  const [feedbackEmail, setFeedbackEmail] = useState("");\n  const [feedbackPhone, setFeedbackPhone] = useState("");\n  const [feedbackMessage, setFeedbackMessage] = useState("");\n  const [feedbackError, setFeedbackError] = useState("");'''
          if anchor not in s: raise SystemExit('settings state anchor not found')
          s = s.replace(anchor, states, 1)
          handler = '''\n  const submitFeedback = (event: React.FormEvent<HTMLFormElement>) => {\n    event.preventDefault();\n    const email = feedbackEmail.trim();\n    const phone = feedbackPhone.trim();\n    const message = feedbackMessage.trim();\n    if (!email || !message) { setFeedbackError("Vui lòng nhập email và nội dung góp ý."); return; }\n    setFeedbackError("");\n    const subject = "Ouk Chatrang — Liên hệ / Góp ý";\n    const body = [`Email: ${email}`, `Số điện thoại: ${phone || "Không cung cấp"}`, "", "Nội dung:", message].join("\\n");\n    const url = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent("kuonkhmer.com+ouk@gmail.com")}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;\n    window.open(url, "_blank", "noopener,noreferrer");\n  };\n'''
          if '  const toggles = [' not in s: raise SystemExit('settings toggles anchor not found')
          s = s.replace('  const toggles = [', handler + '\n  const toggles = [', 1)
          closing = '      </ul>\n    </AppShell>'
          block = '''      </ul>\n\n      <div className="my-5"><KbachDivider /></div>\n      <SectionTitle icon={MessageSquare}>Liên hệ & góp ý</SectionTitle>\n      <section className="overflow-hidden rounded-2xl border border-border bg-card">\n        <button type="button" onClick={() => setFeedbackOpen((value) => !value)} className="flex w-full items-center gap-3 p-3.5 text-left transition-colors hover:bg-secondary/40">\n          <span className="grid h-10 w-10 place-items-center rounded-xl border border-gold/30 bg-gold/10"><Mail className="h-4 w-4 text-gold-dark" /></span>\n          <span className="min-w-0 flex-1"><span className="block text-sm font-semibold text-foreground">Gửi góp ý cho Ouk Chatrang</span><span className="block text-[11px] text-muted-foreground">Email, số điện thoại và nội dung của bạn.</span></span>\n          <span className="text-lg text-gold-dark">{feedbackOpen ? "−" : "+"}</span>\n        </button>\n        {feedbackOpen && (\n          <form onSubmit={submitFeedback} className="grid gap-3 border-t border-border p-3.5 animate-fade-in">\n            <label className="grid gap-1.5 text-xs font-semibold text-foreground">Email <span className="text-red-500">*</span><input type="email" required value={feedbackEmail} onChange={(event) => setFeedbackEmail(event.target.value)} placeholder="ban@example.com" className="rounded-xl border border-border bg-background px-3 py-2.5 text-sm font-normal outline-none transition focus:border-gold" /></label>\n            <label className="grid gap-1.5 text-xs font-semibold text-foreground">Số điện thoại<input type="tel" value={feedbackPhone} onChange={(event) => setFeedbackPhone(event.target.value)} placeholder="+84…" className="rounded-xl border border-border bg-background px-3 py-2.5 text-sm font-normal outline-none transition focus:border-gold" /></label>\n            <label className="grid gap-1.5 text-xs font-semibold text-foreground">Nội dung <span className="text-red-500">*</span><textarea required rows={5} maxLength={3000} value={feedbackMessage} onChange={(event) => setFeedbackMessage(event.target.value)} placeholder="Bạn muốn góp ý điều gì?" className="resize-y rounded-xl border border-border bg-background px-3 py-2.5 text-sm font-normal leading-relaxed outline-none transition focus:border-gold" /></label>\n            {feedbackError ? <p className="text-xs font-medium text-red-500">{feedbackError}</p> : null}\n            <button type="submit" className="shimmer-sheen bg-royal flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow-gold transition active:scale-[0.98]"><Send className="h-4 w-4" /> Mở Gmail để gửi</button>\n            <p className="text-center text-[10px] leading-relaxed text-muted-foreground">Gmail sẽ mở với nội dung đã điền sẵn và gửi tới hộp thư góp ý của Ouk Chatrang.</p>\n          </form>\n        )}\n      </section>\n    </AppShell>'''
          if closing not in s: raise SystemExit('settings closing anchor not found')
          s = s.replace(closing, block, 1)
          p.write_text(s)
          PY
          npx prettier --write src/routes/home.tsx src/routes/play.tsx src/routes/settings.tsx
      - name: Install dependencies
        run: npm ci
      - name: Core engine tests
        run: npm test
      - name: Auth regression tests
        run: npm run test:auth
      - name: Asset integrity
        run: npm run check:assets
      - name: Production build
        run: npm run build
      - name: Commit verified change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/ux-home-play-feedback.yml
          git add src/routes/home.tsx src/routes/play.tsx src/routes/settings.tsx .github/workflows/ux-home-play-feedback.yml
          git commit -m "feat: refresh home play flow and add feedback form"
          git push origin HEAD:fix/home-play-ux-feedback