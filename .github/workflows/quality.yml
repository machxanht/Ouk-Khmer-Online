name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - online-multiplayer
      - security-hardening-auth-ranked
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit high-severity dependencies
        run: |
          set -e
          ok=0
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              ok=1
              break
            fi
            echo "npm audit attempt $attempt failed; retrying..."
            sleep 10
          done
          test "$ok" -eq 1

      - name: Core engine tests
        run: npm test

      - name: Auth security regression tests
        env:
          NODE_ENV: test
          ALLOW_DEV_AUTH_TOKENS: "true"
        run: npm run test:auth

      - name: Server security regression tests
        run: npm run test:security

      - name: Multiplayer core regression tests
        run: npm run test:multiplayer-core

      - name: Multiplayer authenticated runtime tests
        run: npm run test:multiplayer-runtime

      - name: Source asset integrity
        run: npm run check:assets

      - name: Production build
        run: npm run build

      - name: Built asset integrity
        run: npm run check:assets:dist
