name: Build Khmer Ouk APK

on:
  push:
    branches:
      - main
      - online-multiplayer
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Build web app
        run: npm run build

      - name: Verify web output
        run: |
          set -euo pipefail
          test -f .output/public/index.html
          npm run check:assets:dist

      - name: Install Capacitor toolchain
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Verify Capacitor production config
        run: |
          set -euo pipefail
          test -f capacitor.config.ts
          grep -q "ouk.kuonkhmer.com" capacitor.config.ts
          grep -q "androidScheme: 'https'" capacitor.config.ts
          if grep -q "cleartext: true" capacitor.config.ts; then
            echo "ERROR: Capacitor cleartext traffic must be disabled."
            exit 1
          fi
          grep -q "cleartext: false" capacitor.config.ts
          echo "Capacitor production config verified."

      - name: Create Android project
        run: |
          set -euo pipefail
          if [ ! -d android/app ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Install Icon Kitchen launcher icons
        run: |
          set -euo pipefail

          ZIP="IconKitchen-Output.zip"
          RES="android/app/src/main/res"
          test -f "$ZIP"
          test -d "$RES"

          rm -rf icon-kitchen
          mkdir -p icon-kitchen
          unzip -q "$ZIP" -d icon-kitchen

          MDPI_DIR="$(find icon-kitchen -type d -name 'mipmap-mdpi' -print -quit)"
          test -n "$MDPI_DIR"
          ICON_ROOT="$(dirname "$MDPI_DIR")"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            SRC_DIR="$ICON_ROOT/mipmap-$density"
            DEST="$RES/mipmap-$density"
            test -f "$SRC_DIR/Icon-logo-android.png"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp "$SRC_DIR/Icon-logo-android.png" "$DEST/ic_launcher.png"
            cp "$SRC_DIR/Icon-logo-android.png" "$DEST/ic_launcher_round.png"

            if [ -f "$SRC_DIR/Icon-logo-android_foreground.png" ]; then
              cp "$SRC_DIR/Icon-logo-android_foreground.png" "$DEST/ic_launcher_foreground.png"
            fi
            if [ -f "$SRC_DIR/Icon-logo-android_background.png" ]; then
              cp "$SRC_DIR/Icon-logo-android_background.png" "$DEST/ic_launcher_background.png"
            fi
            if [ -f "$SRC_DIR/Icon-logo-android_monochrome.png" ]; then
              cp "$SRC_DIR/Icon-logo-android_monochrome.png" "$DEST/ic_launcher_monochrome.png"
            fi
          done

          ADAPTIVE_XML="$(find "$ICON_ROOT" -type f -name 'Icon-logo-android.xml' -print -quit || true)"
          if [ -n "$ADAPTIVE_XML" ]; then
            rm -rf "$RES/mipmap-anydpi-v26"
            mkdir -p "$RES/mipmap-anydpi-v26"
            sed \
              -e 's/Icon-logo-android_foreground/ic_launcher_foreground/g' \
              -e 's/Icon-logo-android_background/ic_launcher_background/g' \
              -e 's/Icon-logo-android_monochrome/ic_launcher_monochrome/g' \
              -e 's/Icon-logo-android/ic_launcher/g' \
              "$ADAPTIVE_XML" > "$RES/mipmap-anydpi-v26/ic_launcher.xml"
            cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          fi

          INVALID_FILES="$(find "$RES" -type f -path '*/mipmap-*/*' -printf '%f\n' | grep -E '[^a-z0-9_.]' || true)"
          if [ -n "$INVALID_FILES" ]; then
            echo "ERROR: invalid Android resource filenames:"
            echo "$INVALID_FILES"
            exit 1
          fi

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "$RES/mipmap-$density/ic_launcher.png"
            test -f "$RES/mipmap-$density/ic_launcher_round.png"
          done

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Verify Android WebView security config
        run: |
          set -euo pipefail
          grep -q "ouk.kuonkhmer.com" capacitor.config.ts
          if grep -R --line-number --include='*.xml' 'usesCleartextTraffic="true"' android/app/src/main 2>/dev/null; then
            echo "ERROR: generated Android app enables cleartext traffic."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khmer-ouk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
