name: Security hardening follow-up

on:
  push:
    branches:
      - security-hardening-followup

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply targeted hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("server/room-manager.ts")
          text = path.read_text()
          original = text

          text, pin_count = re.subn(
              r'const pin = Math\.floor\(100000 \+ Math\.random\(\) \* 900000\)\.toString\(\);',
              'const pin = crypto.randomInt(100000, 1000000).toString();',
              text,
          )
          text = text.replace(
              'return Math.floor(100000 + Math.random() * 900000).toString();',
              'throw new Error("Unable to generate a unique private-room PIN");',
              1,
          )

          text, sig_count = re.subn(
              r'(public handleReconnect\(\n\s+newSocketId: string,\n\s+roomId: string,\n\s+)sessionToken\?: string,\n\s+color\?: string,',
              r'\1sessionToken: string,',
              text,
              count=1,
          )

          lookup_pattern = re.compile(
              r'''    let targetPlayer: PlayerInfo \| null = null;\n'''
              r'''    let opponent: PlayerInfo \| null = null;\n\n'''
              r'''    if \(sessionToken\) \{\n'''
              r'''      if \(room\.players\.w\?\.sessionToken === sessionToken\) \{\n'''
              r'''        targetPlayer = room\.players\.w;\n'''
              r'''        opponent = room\.players\.b;\n'''
              r'''      \} else if \(room\.players\.b\?\.sessionToken === sessionToken\) \{\n'''
              r'''        targetPlayer = room\.players\.b;\n'''
              r'''        opponent = room\.players\.w;\n'''
              r'''      \} else \{\n'''
              r'''        // If an invalid sessionToken was explicitly supplied, reject reconnection\n'''
              r'''        serverLogger\.warn\("RECONNECT", \{\n'''
              r'''          roomId,\n'''
              r'''          socketId: newSocketId,\n'''
              r'''          details: \{ error: "INVALID_SESSION_TOKEN" \},\n'''
              r'''        \}\);\n'''
              r'''        return \{ success: false, error: "Phiên đăng nhập không hợp lệ hoặc đã hết hạn\." \};\n'''
              r'''      \}\n'''
              r'''    \} else if \(color === "w" \|\| color === "b"\) \{\n'''
              r'''      targetPlayer = room\.players\[color\];\n'''
              r'''      opponent = color === "w" \? room\.players\.b : room\.players\.w;\n'''
              r'''    \}\n\n'''
              r'''    if \(!targetPlayer\) \{\n'''
              r'''      serverLogger\.warn\("RECONNECT", \{\n'''
              r'''        roomId,\n'''
              r'''        socketId: newSocketId,\n'''
              r'''        details: \{ error: "INVALID_SESSION_INFO" \},\n'''
              r'''      \}\);\n'''
              r'''      return \{ success: false, error: "Không tìm thấy thông tin phiên người chơi\." \};\n'''
              r'''    \}'''
          )
          replacement = '''    let targetPlayer: PlayerInfo | null = null;
          let opponent: PlayerInfo | null = null;

          if (room.players.w?.sessionToken === sessionToken) {
            targetPlayer = room.players.w;
            opponent = room.players.b;
          } else if (room.players.b?.sessionToken === sessionToken) {
            targetPlayer = room.players.b;
            opponent = room.players.w;
          } else {
            serverLogger.warn("RECONNECT", {
              roomId,
              socketId: newSocketId,
              details: { error: "INVALID_SESSION_TOKEN" },
            });
            return { success: false, error: "Phiên đăng nhập không hợp lệ hoặc đã hết hạn." };
          }'''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines())
          text, lookup_count = lookup_pattern.subn(replacement, text, count=1)

          already_hardened = (
              'crypto.randomInt(100000, 1000000)' in original
              and 'sessionToken: string,' in original
              and 'color?: string' not in original
          )
          if not already_hardened:
              if pin_count != 1:
                  raise SystemExit(f"Expected one Math.random PIN assignment, found {pin_count}")
              if sig_count != 1:
                  raise SystemExit(f"Expected one reconnect signature, found {sig_count}")
              if lookup_count != 1:
                  raise SystemExit(f"Expected one reconnect fallback block, found {lookup_count}")

          if text != original:
              path.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: Core tests
        run: npm test

      - name: Auth security tests
        run: npm run test:auth

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/room-manager.ts
          git commit -m "security: require session token reconnect and secure PINs"
          git push origin HEAD:security-hardening-followup
