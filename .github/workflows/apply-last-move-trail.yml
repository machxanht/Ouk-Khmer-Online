name: Apply last-move trail

on:
  push:
    branches: [fix/last-move-trail]
    paths: [.github/workflows/apply-last-move-trail.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/last-move-trail
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused board highlight change
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/ChessBoard.tsx')
          s = p.read_text()
          old = '''  const theme = BOARD_THEMES[boardTheme];
  const order = Array.from({ length: 64 }, (_, i) => (flipped ? 63 - i : i));
'''
          new = '''  const theme = BOARD_THEMES[boardTheme];
  const order = Array.from({ length: 64 }, (_, i) => (flipped ? 63 - i : i));

  // Paint the complete geometry of the latest move, not only its endpoints.
  // For a knight this deliberately draws a visible L-shaped trail so the jump is easy to read.
  const lastMoveTrail = (() => {
    const trail = new Set<number>();
    if (!lastMove) return trail;

    const { from, to } = lastMove;
    trail.add(from);
    trail.add(to);

    const fromRow = Math.floor(from / 8);
    const fromCol = from % 8;
    const toRow = Math.floor(to / 8);
    const toCol = to % 8;
    const rowDelta = toRow - fromRow;
    const colDelta = toCol - fromCol;
    const movedPiece = board[to];

    if (
      movedPiece?.type === "n" &&
      ((Math.abs(rowDelta) === 2 && Math.abs(colDelta) === 1) ||
        (Math.abs(rowDelta) === 1 && Math.abs(colDelta) === 2))
    ) {
      if (Math.abs(rowDelta) === 2) {
        trail.add((fromRow + Math.sign(rowDelta)) * 8 + fromCol);
        trail.add(toRow * 8 + fromCol);
      } else {
        trail.add(fromRow * 8 + fromCol + Math.sign(colDelta));
        trail.add(fromRow * 8 + toCol);
      }
      return trail;
    }

    const aligned =
      rowDelta === 0 || colDelta === 0 || Math.abs(rowDelta) === Math.abs(colDelta);
    if (!aligned) return trail;

    const rowStep = Math.sign(rowDelta);
    const colStep = Math.sign(colDelta);
    let row = fromRow + rowStep;
    let col = fromCol + colStep;
    while (row !== toRow || col !== toCol) {
      trail.add(row * 8 + col);
      row += rowStep;
      col += colStep;
    }

    return trail;
  })();
'''
          if old not in s:
            raise SystemExit('anchor 1 not found')
          s = s.replace(old, new, 1)
          old2 = '''          const isLast = lastMove && (lastMove.from === i || lastMove.to === i);
'''
          new2 = '''          const isLast = lastMoveTrail.has(i);
'''
          if old2 not in s:
            raise SystemExit('anchor 2 not found')
          s = s.replace(old2, new2, 1)
          old3 = '''                    lastMove?.to === i ? "bg-gold/30 ring-1 ring-inset ring-gold/60" : "bg-gold/15"
'''
          new3 = '''                    lastMove?.to === i
                      ? "bg-amber-300/50 ring-2 ring-inset ring-amber-500/80"
                      : lastMove?.from === i
                        ? "bg-amber-300/35 ring-1 ring-inset ring-amber-500/60"
                        : "bg-amber-300/30 ring-1 ring-inset ring-amber-400/35"
'''
          if old3 not in s:
            raise SystemExit('anchor 3 not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit verified change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-last-move-trail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChessBoard.tsx .github/workflows/apply-last-move-trail.yml
          git commit -m "feat(board): show full last-move trail"
          git push origin HEAD:fix/last-move-trail
