name: One-time production self-check final

on:
  push:
    branches:
      - test/production-self-check-final-20260905

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Core/security/runtime regressions
        run: |
          npm run test:security
          npm run test:multiplayer-core
          npm run test:multiplayer-runtime

      - name: AI fallback + bot ranked skip
        shell: bash
        run: |
          cat > scripts/.tmp-ai-final.ts <<'TS'
          import { io as ClientIO, type Socket } from "socket.io-client";
          process.env.NODE_ENV = "test";
          process.env.ALLOW_DEV_AUTH_TOKENS = "true";
          process.env.FIREBASE_SERVICE_ACCOUNT_JSON = JSON.stringify({
            project_id: "must-not-be-used-for-bot",
            client_email: "unused@example.invalid",
            private_key: "invalid-on-purpose",
          });
          const originalRandom = Math.random;
          Math.random = () => 0;
          const { createRealtimeServer } = await import("../server/index");
          const { roomManager } = await import("../server/room-manager");
          const { rankedManager } = await import("../server/ranked-manager");
          const server = createRealtimeServer({ port: 39778, corsOrigin: "*" });
          let client: Socket | null = null;
          const withTimeout = <T>(p: Promise<T>, ms: number, label: string) => new Promise<T>((resolve, reject) => {
            const t = setTimeout(() => reject(new Error(`timeout: ${label}`)), ms);
            p.then(v => { clearTimeout(t); resolve(v); }, e => { clearTimeout(t); reject(e); });
          });
          try {
            await server.start();
            client = ClientIO("http://127.0.0.1:39778", { transports:["websocket"], reconnection:false, forceNew:true });
            await withTimeout(new Promise<void>((resolve, reject) => {
              client!.once("connect", () => resolve());
              client!.once("connect_error", reject);
            }), 5000, "connect");
            const t0 = Date.now();
            const started = withTimeout(new Promise<any>(resolve => client!.once("game:start", resolve)), 15000, "ai fallback");
            client.emit("matchmaking:join", { playerName:"Tester", rulesetId:"folk", authToken:"test_token_ai_final" });
            const game = await started;
            const elapsed = Date.now() - t0;
            if (elapsed < 9000 || elapsed > 14000) throw new Error(`AI fallback delay ${elapsed}ms`);
            if ("isBot" in game || "isBot" in (game.opponent || {})) throw new Error("bot flag leaked");
            if (!Number.isFinite(game.opponent?.rating) || game.opponent.rating < 1380 || game.opponent.rating > 1819) throw new Error("bot rating outside band");
            const room = roomManager.getRoomById(game.roomId);
            if (!room?.isBotRoom) throw new Error("server bot-room marker missing");
            await rankedManager.finalize(room, "draw", "self_check_bot_rank_skip");
            console.log(`AI fallback PASS ${elapsed}ms; client bot flag hidden; ranked skip PASS`);
          } finally {
            Math.random = originalRandom;
            client?.disconnect();
            await server.stop().catch(() => undefined);
            roomManager.clear();
          }
          process.exit(0);
          TS
          npx tsx scripts/.tmp-ai-final.ts
          rm -f scripts/.tmp-ai-final.ts

      - name: Production black-box/security/load smoke
        shell: bash
        run: |
          cat > scripts/.tmp-prod-final.mjs <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { io } from "socket.io-client";
          const cfg = JSON.parse(fs.readFileSync("firebase-applet-config.json", "utf8"));
          const B = "https://ouk-khmer-backend-production.up.railway.app";
          const W = "https://ouk.kuonkhmer.com";
          async function j(url, options) { const r=await fetch(url, options); assert.ok(r.ok, `${url} HTTP ${r.status}`); return {r,b:await r.json()}; }
          function wait(socket,event,pred=()=>true,ms=6000){return new Promise((resolve,reject)=>{const h=x=>{if(!pred(x))return;clearTimeout(t);socket.off(event,h);resolve(x)};const t=setTimeout(()=>{socket.off(event,h);reject(new Error(`timeout ${event}`))},ms);socket.on(event,h);});}
          const {b:h}=await j(`${B}/health`); assert.equal(h.status,"healthy"); assert.deepEqual(Object.keys(h).sort(),["status","timestamp"]);
          for(const u of [`${B}/api/online-count`,`${W}/api/online-count`]){const {b}=await j(u);assert.equal(b.onlineCount,b.realCount+50);}
          const allowed = new Set(["uid","displayName","photoURL","rating","peakRating","wins","losses","draws","winStreak","gamesPlayed"]);
          for(const u of [`${B}/api/leaderboard?limit=5000`,`${W}/api/leaderboard?limit=5000`]){const {b}=await j(u);assert.ok(Array.isArray(b.players)&&b.players.length<=100);for(const p of b.players)for(const k of Object.keys(p))assert.ok(allowed.has(k),`leaderboard leak ${k}`);}
          const root=await fetch(`${W}/`);assert.ok(root.ok);assert.ok((root.headers.get("strict-transport-security")||"").includes("max-age="));assert.equal(root.headers.get("x-content-type-options"),"nosniff");assert.equal(root.headers.get("x-frame-options"),"SAMEORIGIN");assert.ok(root.headers.get("referrer-policy"));assert.ok(root.headers.get("permissions-policy"));
          const {b:manifest}=await j(`${W}/manifest.json`);const mt=JSON.stringify(manifest);for(const icon of ["icon-192-20260904.png","icon-512-20260904.png","icon-192-maskable-20260904.png","icon-512-maskable-20260904.png"]){assert.ok(mt.includes(icon));assert.ok((await fetch(`${W}/${icon}`)).ok);};assert.ok((await fetch(`${W}/apple-touch-icon-20260904.png`)).ok);
          const polling=`${B}/socket.io/?EIO=4&transport=polling&t=${Date.now()}`;const ca=await fetch(polling,{headers:{Origin:W}});assert.equal(ca.headers.get("access-control-allow-origin"),W);const ce=await fetch(polling,{headers:{Origin:"https://evil.example"}});assert.notEqual(ce.headers.get("access-control-allow-origin"),"*");assert.notEqual(ce.headers.get("access-control-allow-origin"),"https://evil.example");
          const s=io(B,{transports:["websocket"],reconnection:false,forceNew:true,extraHeaders:{Origin:W}});await wait(s,"connect");let p=wait(s,"game:error",x=>x?.code==="AUTH_REQUIRED");s.emit("matchmaking:join",{playerName:"noauth"});await p;p=wait(s,"room:error",x=>x?.code==="AUTH_REQUIRED");s.emit("create:private",{playerName:"noauth"});await p;p=wait(s,"game:error",x=>x?.code==="RATE_LIMITED");for(let i=0;i<8;i++)s.emit("game:resign");await p;s.disconnect();
          const base=`https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/${cfg.firestoreDatabaseId}/documents`;for(const c of ["users","match_history"]){const r=await fetch(`${base}/${c}?pageSize=1&key=${cfg.apiKey}`);assert.equal(r.status,403);const b=await r.json();assert.equal(b?.error?.status,"PERMISSION_DENIED");}
          const clients=Array.from({length:20},()=>io(B,{transports:["websocket"],reconnection:false,forceNew:true,extraHeaders:{Origin:W}}));try{await Promise.all(clients.map(c=>wait(c,"connect",()=>true,8000)));const {b}=await j(`${B}/health`);assert.deepEqual(Object.keys(b).sort(),["status","timestamp"]);}finally{for(const c of clients)c.disconnect();}
          console.log("PRODUCTION BLACK-BOX PASS: health/routing/privacy/headers/PWA/CORS/auth/rate-limit/Firestore/load");
          JS
          node scripts/.tmp-prod-final.mjs
          rm -f scripts/.tmp-prod-final.mjs
