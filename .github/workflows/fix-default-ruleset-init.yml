name: Fix default ruleset match init

on:
  push:
    branches:
      - fix/home-play-ux-feedback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-play-ux-feedback
          fetch-depth: 0
      - name: Apply targeted fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/play.tsx')
          s = p.read_text()
          old = '  const [matchRulesetId, setMatchRulesetId] = useState<RuleSetId>("folk");'
          new = '''  const [matchRulesetId, setMatchRulesetId] = useState<RuleSetId>(\n    settings.defaultRuleset ?? "folk",\n  );'''
          if old not in s:
              raise SystemExit('matchRulesetId initializer not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write src/routes/play.tsx
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-default-ruleset-init.yml
          git add src/routes/play.tsx .github/workflows/fix-default-ruleset-init.yml
          git commit -m "fix: honor saved ruleset when entering offline match"
          git push origin HEAD:fix/home-play-ux-feedback