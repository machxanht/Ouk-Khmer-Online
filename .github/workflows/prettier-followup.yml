name: Format hardening follow-up

on:
  push:
    branches:
      - security-hardening-followup

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format room manager
        run: npx prettier --write server/room-manager.ts
      - run: npm test
      - run: npm run test:auth
      - run: npm run build
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/room-manager.ts
          git commit -m "style: format room manager hardening"
          git push origin HEAD:security-hardening-followup
